name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Verify version and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(cat VERSION)" = "$TAG"
          mkdir -p dist
          git archive --format=zip --prefix=ozbargain-radar/ -o "dist/ozbargain-radar-$TAG.zip" HEAD
          cd dist
          sha256sum *.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "OzBargain Radar $TAG" --generate-notes
          fi
